<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062D2C" />
    <title>Doña Isidora — Flota Menor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Autorecuperación: una app instalada con caché de una versión anterior puede pedir archivos que
      // el deploy ya reemplazó y quedar en blanco. Si la app no se monta, se limpia el service worker
      // y el caché de archivos (no IndexedDB: los checklists pendientes y borradores se conservan)
      // y se recarga una sola vez. Si tras eso sigue sin montarse, se muestra el motivo en pantalla.
      var erroresInicio = []
      window.addEventListener('error', function (e) {
        var t = e.target && (e.target.src || e.target.href)
        erroresInicio.push((e.message || 'Error al cargar') + ' (' + String(t || e.filename || '').split('/').pop() + ')')
      }, true)
      window.addEventListener('unhandledrejection', function (e) {
        erroresInicio.push(String((e.reason && e.reason.message) || e.reason))
      })
      setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        var yaIntentado = false
        try {
          yaIntentado = !!sessionStorage.getItem('di-recuperacion')
          sessionStorage.setItem('di-recuperacion', '1')
        } catch (e) { yaIntentado = true }
        if (yaIntentado) {
          var pre = document.createElement('pre')
          pre.style.cssText = 'padding:16px;font:12px monospace;white-space:pre-wrap;word-break:break-word;color:#C0402A'
          pre.textContent = 'No se pudo iniciar la app.\n\n' + (erroresInicio.join('\n') || 'Sin detalle del error.')
          root.appendChild(pre)
          return
        }
        var limpiar = []
        if ('serviceWorker' in navigator) {
          limpiar.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister() }))
          }))
        }
        if (window.caches) {
          limpiar.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }))
        }
        Promise.all(limpiar).catch(function () {}).then(function () { location.reload() })
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
